  - id: hard_11_dedupe_folder
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, random
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h11'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      blobs = [os.urandom(random.randint(200, 3000)) for _ in range(5)]
      ORIG, DUPES = [], []
      for i, b in enumerate(blobs):
          n = f'file_{i}.bin'; ORIG.append(n)
          with open(os.path.join(D, n), 'wb') as f: f.write(b)
      for i in (0, 2, 4):
          n = f'copy_of_file_{i}.bin'; DUPES.append(n)
          with open(os.path.join(D, n), 'wb') as f: f.write(blobs[i])
    prompt: "In ~/Desktop/seguro_wf_eval/h11 find files that are exact duplicates of each other (same content, compare SHA-256 hashes), keep the file_N.bin originals, move every duplicate copy into a subfolder named duplicates, and write duplicates_report.xlsx in h11 listing each duplicate, its original and the hash."
    check: |
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h11')
      assert sorted(os.listdir(os.path.join(D, 'duplicates'))) == sorted(DUPES), os.listdir(os.path.join(D, 'duplicates'))
      assert all(os.path.exists(os.path.join(D, n)) for n in ORIG), 'an original was moved'
      flat = ' '.join(str(c) for r in xlsx_rows(os.path.join(D, 'duplicates_report.xlsx')) for c in r)
      assert all(n in flat for n in DUPES), 'report misses duplicates'
    timeout_s: 900

  - id: hard_12_clean_csv
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, random
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h12'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      rows = [(f'  Customer {i} ', random.choice(['pune', 'PUNE', 'Mumbai ', 'mumbai']), random.randint(1, 99)) for i in range(20)]
      rows += [rows[3], rows[7]]                       # 2 exact duplicate rows
      rows += [('Customer 99', '', 5)]                 # missing city
      with open(os.path.join(D, 'customers_raw.csv'), 'w') as f:
          f.write('name,city,orders\n' + '\n'.join(f'{a},{b},{c}' for a, b, c in rows))
      CLEAN = {(a.strip(), b.strip().title()) for a, b, c in rows if b.strip()}
    prompt: "Clean customers_raw.csv in ~/Desktop/seguro_wf_eval/h12: trim spaces in names and cities, write city names in Title Case, remove exact duplicate rows and rows with a missing city, and save the result as customers_clean.csv in that folder."
    check: |
      import csv
      rows = list(csv.DictReader(open(os.path.expanduser(r'~/Desktop/seguro_wf_eval/h12/customers_clean.csv'))))
      got = {(r['name'], r['city']) for r in rows}
      assert len(rows) == len(CLEAN) and got == CLEAN, f'{len(rows)} rows; diff {list(got ^ CLEAN)[:4]}'
    timeout_s: 900

  - id: hard_13_local_api_to_excel
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, random, json as _j
      D = os.path.expanduser(r'~/SeguroProjects/seguro_wf_api'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      PRODUCTS = [{'sku': f'SKU-{i}', 'name': f'Item {i}', 'stock': random.randint(0, 60)} for i in range(12)]
      with open(os.path.join(D, 'products.json'), 'w') as f: f.write(_j.dumps(PRODUCTS))
      LOW = sorted(p['sku'] for p in PRODUCTS if p['stock'] < 10)
      E = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h13'); shutil.rmtree(E, ignore_errors=True); os.makedirs(E)
    prompt: "Serve the folder ~/SeguroProjects/seguro_wf_api over HTTP on port 5077 (python -m http.server), fetch http://127.0.0.1:5077/products.json from that local server, and save every product with stock below 10 to low_stock.xlsx in ~/Desktop/seguro_wf_eval/h13 with columns sku, name and stock. Stop the server afterwards."
    check: |
      rows = xlsx_rows(os.path.expanduser(r'~/Desktop/seguro_wf_eval/h13/low_stock.xlsx'))
      got = sorted(str(r[0]) for r in rows[1:])
      assert got == LOW, f'{got} != {LOW}'
      assert any(e['type'] == 'tool_call' and e['data'].get('tool') == 'process_start' and e['data'].get('verified') for e in events), 'server never started'
    timeout_s: 900

  - id: hard_14_code_with_tests
    category: workflow_hard
    workflow: true
    setup: |
      import shutil
      D = os.path.expanduser(r'~/SeguroProjects/seguro_wf_code'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
    prompt: "In ~/SeguroProjects/seguro_wf_code write a Python module textstats.py with a function word_frequencies(text) that returns a dict of lowercase word counts ignoring punctuation, write test_textstats.py with at least 3 pytest tests for it, run pytest in that folder, and save the pytest output to test_results.txt there."
    check: |
      import subprocess, sys
      D = os.path.expanduser(r'~/SeguroProjects/seguro_wf_code')
      r = subprocess.run([sys.executable, '-c', "import textstats as t; d=t.word_frequencies('The cat, the CAT! a dog.'); assert d['the']==2 and d['cat']==2 and d['dog']==1, d"], cwd=D, capture_output=True, text=True)
      assert r.returncode == 0, r.stderr[-400:]
      out = open(os.path.join(D, 'test_results.txt')).read()
      assert 'passed' in out and 'failed' not in out, out[-300:]
      r2 = subprocess.run([sys.executable, '-m', 'pytest', '-q'], cwd=D, capture_output=True, text=True)
      assert r2.returncode == 0, 'tests do not pass when re-run'
    timeout_s: 900

  - id: hard_15_largest_files
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, random
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h15'); shutil.rmtree(D, ignore_errors=True)
      SIZES = {}
      for sub in ('a', 'b/c', 'd'):
          os.makedirs(os.path.join(D, 'tree', sub), exist_ok=True)
          for k in range(4):
              n = os.path.join('tree', sub, f'f{k}.dat'); s = random.randint(1000, 900000); SIZES[os.path.basename(sub) + '/' + f'f{k}.dat'] = s
              with open(os.path.join(D, n), 'wb') as f: f.write(b'\0' * s)
      TOP5 = sorted(SIZES.values(), reverse=True)[:5]
    prompt: "Find the 5 largest files anywhere inside ~/Desktop/seguro_wf_eval/h15/tree (including subfolders) and save them to largest.xlsx in ~/Desktop/seguro_wf_eval/h15 with columns path and size_bytes, sorted from largest to smallest."
    check: |
      rows = xlsx_rows(os.path.expanduser(r'~/Desktop/seguro_wf_eval/h15/largest.xlsx'))
      sizes = [int(float(r[1])) for r in rows[1:6]]
      assert sizes == TOP5, f'{sizes} != {TOP5}'
    timeout_s: 900

  - id: hard_16_markdown_to_doc_and_deck
