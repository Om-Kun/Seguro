  - id: hard_10_news_deep_dive
    category: workflow_hard
    workflow: true
    setup: |
      import shutil
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h10'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
    prompt: "Find the 3 latest news articles about robotics, read the full text of the first article, and write robotics_brief.docx in ~/Desktop/seguro_wf_eval/h10 with the three headlines, their sources and links, and a 5-sentence summary of the first article."
