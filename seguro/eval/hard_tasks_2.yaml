  - id: hard_17_system_profile
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, ctypes
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h17'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      u = ctypes.windll.user32; u.SetProcessDPIAware(); RES = f'{u.GetSystemMetrics(0)}x{u.GetSystemMetrics(1)}'
      import platform; HOST = platform.node()
    prompt: "Build a system profile of this PC using PowerShell: computer name, Windows version, screen resolution, total RAM in GB and GPU name. Save it as system_profile.docx in ~/Desktop/seguro_wf_eval/h17."
    check: |
      t = docx_text(os.path.expanduser(r'~/Desktop/seguro_wf_eval/h17/system_profile.docx')).replace(' ', '')
      assert HOST.lower() in t.lower(), f'computer name {HOST} missing'
      assert RES.replace('x', '') in t.replace('x', '').replace('×', '').replace('by', ''), f'resolution {RES} missing'
      assert 'rtx' in t.lower() or 'nvidia' in t.lower(), 'GPU missing'
    timeout_s: 900

  - id: hard_18_archive_and_verify
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, random
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h18'); shutil.rmtree(D, ignore_errors=True); os.makedirs(os.path.join(D, 'project'))
      FILES = {}
      for i in range(6):
          n = f'part{i}.txt'; FILES[n] = 'x' * random.randint(10, 500)
          with open(os.path.join(D, 'project', n), 'w') as f: f.write(FILES[n])
    prompt: "Compress the folder ~/Desktop/seguro_wf_eval/h18/project into project_backup.zip in ~/Desktop/seguro_wf_eval/h18, then verify the archive by listing its contents and file sizes into archive_manifest.txt in the same folder."
    check: |
      import zipfile
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h18')
      with zipfile.ZipFile(os.path.join(D, 'project_backup.zip')) as z:
          names = {os.path.basename(n): z.read(n).decode() for n in z.namelist() if not n.endswith('/')}
      assert names == FILES, f'zip has {sorted(names)}'
      m = open(os.path.join(D, 'archive_manifest.txt')).read()
      assert all(n in m for n in FILES), 'manifest incomplete'
    timeout_s: 900
