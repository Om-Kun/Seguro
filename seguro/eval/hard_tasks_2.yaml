# 14 more hard tasks: vision/webcam, data, files, code, web. Every checker recomputes the answer
# from the fixtures or inspects the produced files; none trusts the agent's own status.
# `requires: camera` tasks are SKIPPED (not failed) when no camera is connected.
tasks:
  - id: hard_05_photo_objects_report
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, ultralytics
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h5'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      shutil.copy(os.path.join(os.path.dirname(ultralytics.__file__), 'assets', 'bus.jpg'), os.path.join(D, 'street.jpg'))
    prompt: "Identify the objects in the photo street.jpg in ~/Desktop/seguro_wf_eval/h5, save a table of each object type and how many there are to objects.xlsx in that folder with a bar chart, then write objects_report.docx there describing what was found and embedding the annotated detection image."
    check: |
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h5')
      rows = xlsx_rows(os.path.join(D, 'objects.xlsx')); got = {str(r[0]).lower(): r[1] for r in rows[1:]}
      assert str(got.get('person')).split('.')[0] == '3' and str(got.get('bus')).split('.')[0] == '1', f'counts {got}'
      assert xlsx_charts(os.path.join(D, 'objects.xlsx')) >= 1, 'no chart'
      t = docx_text(os.path.join(D, 'objects_report.docx')).lower()
      assert 'bus' in t and 'person' in t, 'report does not mention the objects'
      assert docx_images(os.path.join(D, 'objects_report.docx')) >= 1, 'no annotated image'
    timeout_s: 900

  - id: hard_06_portrait_deck
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, ultralytics
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h6'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      shutil.copy(os.path.join(os.path.dirname(ultralytics.__file__), 'assets', 'zidane.jpg'), os.path.join(D, 'guest.jpg'))
    prompt: "Make a pencil-sketch portrait of the person in guest.jpg in ~/Desktop/seguro_wf_eval/h6, then create portrait_deck.pptx in that folder with 2 slides: the first showing the original photo, the second showing the sketch portrait."
