  - id: hard_07_paint_portrait
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, ultralytics, time
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h7'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      shutil.copy(os.path.join(os.path.dirname(ultralytics.__file__), 'assets', 'zidane.jpg'), os.path.join(D, 'sitter.jpg'))
      T0 = time.time()
    prompt: "Draw a portrait of the person in sitter.jpg (in ~/Desktop/seguro_wf_eval/h7) by hand in Microsoft Paint, then copy the finished drawing into that folder as paint_portrait.png."
    check: |
      import numpy as np
      from PIL import Image
      p = os.path.join(os.path.expanduser(r'~/Desktop/seguro_wf_eval/h7'), 'paint_portrait.png')
      a = np.array(Image.open(p).convert('L'))
      ink = float((a < 100).mean())
      assert 0.003 < ink < 0.35, f'drawing has {ink:.4f} dark-pixel ratio (blank or not a line drawing)'
      assert any(e['type'] == 'tool_call' and e['data'].get('tool') == 'portrait_paint_in_paint' and e['data'].get('verified') for e in events), 'Paint drawing tool was not used'
    cleanup: "import subprocess; subprocess.run(['taskkill', '/IM', 'mspaint.exe', '/F'], capture_output=True)"
    timeout_s: 900

  - id: hard_08_scene_description
    category: workflow_hard
    workflow: true
    setup: |
      import shutil, ultralytics
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h8'); shutil.rmtree(D, ignore_errors=True); os.makedirs(D)
      shutil.copy(os.path.join(os.path.dirname(ultralytics.__file__), 'assets', 'bus.jpg'), os.path.join(D, 'scene.jpg'))
    prompt: "Look at the photo scene.jpg in ~/Desktop/seguro_wf_eval/h8 with the vision model, describe the scene in detail (vehicles, people, setting), and save the description as scene_report.docx in that folder with the photo embedded."
    check: |
      D = os.path.expanduser(r'~/Desktop/seguro_wf_eval/h8')
      t = docx_text(os.path.join(D, 'scene_report.docx')).lower()
      assert 'bus' in t and ('people' in t or 'person' in t or 'man' in t or 'pedestrian' in t), t[:300]
