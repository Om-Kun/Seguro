    check: "p = os.path.expanduser(r'~/Desktop/user_env.txt'); assert os.path.exists(p) and len(open(p).read().strip()) > 0"
    cleanup: "p = os.path.expanduser(r'~/Desktop/user_env.txt'); os.remove(p) if os.path.exists(p) else None"
    timeout_s: 25

  - id: multi_08_python_bench
    category: multi_app
    prompt: "Run a python script that benchmarks 10000 sqrt operations and writes elapsed time to bench.txt on Desktop"
    check: "p = os.path.expanduser(r'~/Desktop/bench.txt'); assert os.path.exists(p) and os.path.getsize(p) > 0"
    cleanup: "p = os.path.expanduser(r'~/Desktop/bench.txt'); os.remove(p) if os.path.exists(p) else None"
    timeout_s: 25

