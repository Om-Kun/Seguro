# SEGURO V2 EMPIRICAL EVALUATION SUITE (60 VERIFIABLE TASKS)
# Covers 8 Core Workstation Categories:
# 1. App Launch (10)
# 2. File Operations (8)
# 3. Office & Analytics (10)
# 4. Web & Browser (8)
# 5. Windows Settings (5)
# 6. Multi-App Workflows (8)
# 7. Visual / Custom UI (6)
# 8. Coding Agent Delegation (5)

tasks:
  # ----------------------------------------------------
  # CORE AUDIT TASKS (6) — checkers inspect real end state, never state.status alone
  # ----------------------------------------------------
  - id: core_01_calculator
    category: core
    prompt: "Open calculator"
    setup: "[windows_close('Calculator') for _ in range(2)]"
    check: "import time; time.sleep(1.0); wins = [w['title'].lower() for w in windows_list()]; assert any(t == 'calculator' or t.startswith('calculator') for t in wins), wins"
    cleanup: "windows_close('Calculator')"
    timeout_s: 60

  - id: core_02_notepad_save
    category: core
    prompt: "Open Notepad, type the text 'Seguro audit line 1', and save it as seguro_notepad_test.txt on the Desktop"
    setup: "p = os.path.expanduser(r'~/Desktop/seguro_notepad_test.txt'); os.remove(p) if os.path.exists(p) else None"
    check: "p = os.path.expanduser(r'~/Desktop/seguro_notepad_test.txt'); assert os.path.exists(p), 'file missing'; assert 'Seguro audit line 1' in open(p, encoding='utf-8', errors='replace').read(), 'text missing'"
    cleanup: "p = os.path.expanduser(r'~/Desktop/seguro_notepad_test.txt'); os.remove(p) if os.path.exists(p) else None; windows_close('Notepad')"
    timeout_s: 120

  - id: core_03_excel_chart
    category: core
    prompt: "Create an Excel workbook core_sales.xlsx on the Desktop with columns Month and Sales for Jan, Feb, Mar, Apr with numeric sales values, and a bar chart of sales"
    setup: "p = os.path.expanduser(r'~/Desktop/core_sales.xlsx'); os.remove(p) if os.path.exists(p) else None"
    check: |
      import openpyxl
      p = os.path.expanduser(r'~/Desktop/core_sales.xlsx')
      assert os.path.exists(p), 'workbook missing'
      ws = openpyxl.load_workbook(p).active
      rows = [r for r in ws.iter_rows(values_only=True) if any(c is not None for c in r)]
      assert len(rows) >= 5, f'expected header + 4 rows, got {len(rows)}'
      nums = [r[1] for r in rows[1:] if isinstance(r[1], (int, float))]
      assert len(nums) >= 4, f'sales column not numeric: {rows}'
      assert len(ws._charts) >= 1, 'no chart in sheet'
    cleanup: "p = os.path.expanduser(r'~/Desktop/core_sales.xlsx'); os.remove(p) if os.path.exists(p) else None; windows_close('core_sales')"
    timeout_s: 120

  - id: core_04_dark_mode
    category: core
    prompt: "Turn on dark mode for Windows apps"
    approve: [settings_set_theme, skill_theme]
    setup: |
      import winreg, json
      k = winreg.OpenKey(winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', 0, winreg.KEY_ALL_ACCESS)
      f = os.path.join(os.environ['TEMP'], 'seguro_eval_theme.json')
      if not os.path.exists(f):  # keep the user's real original across repeated runs
          orig = {n: winreg.QueryValueEx(k, n)[0] for n in ('AppsUseLightTheme', 'SystemUsesLightTheme')}
          open(f, 'w').write(json.dumps(orig))
      winreg.SetValueEx(k, 'AppsUseLightTheme', 0, winreg.REG_DWORD, 1)
    check: |
      import winreg
      k = winreg.OpenKey(winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize')
      v = winreg.QueryValueEx(k, 'AppsUseLightTheme')[0]
      assert v == 0, f'AppsUseLightTheme is {v}, expected 0'
    cleanup: |
      import winreg, json
      f = os.path.join(os.environ['TEMP'], 'seguro_eval_theme.json')
      if os.path.exists(f):
          orig = json.load(open(f))
          k = winreg.OpenKey(winreg.HKEY_CURRENT_USER, r'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', 0, winreg.KEY_ALL_ACCESS)
          for n, v in orig.items():
              winreg.SetValueEx(k, n, 0, winreg.REG_DWORD, v)
          os.remove(f)
      windows_close('Settings')
    timeout_s: 120

  # Page title is a random nonce written at setup, so the agent can only answer by
  # actually opening the page and reading the real browser title (works offline).
  - id: core_05_browser_title
    category: core
    prompt: "Open the file seguro_title_probe.html from my Desktop in Brave and tell me the page title shown in the browser"
    setup: |
      import random
      nonce = f'Probe {random.randint(100000, 999999)}'
      open(os.path.join(os.environ['TEMP'], 'seguro_title_nonce.txt'), 'w').write(nonce)
      open(os.path.expanduser(r'~/Desktop/seguro_title_probe.html'), 'w').write(f'<html><head><title>{nonce}</title></head><body>title probe</body></html>')
    check: |
      import time; time.sleep(2.0)
      nonce = open(os.path.join(os.environ['TEMP'], 'seguro_title_nonce.txt')).read().strip()
      titles = [w['title'] for w in windows_list() if 'brave' in w['title'].lower()]
      assert any(nonce in t for t in titles), f'no Brave window showing {nonce!r}: {titles}'
      assert nonce in (state.final_evidence or ''), f'answer lacks real title {nonce!r}: {(state.final_evidence or "")[:200]!r}'
    cleanup: "p = os.path.expanduser(r'~/Desktop/seguro_title_probe.html'); os.remove(p) if os.path.exists(p) else None"
    timeout_s: 120

  - id: core_06_move_by_size
    category: core
    prompt: "In the folder seguro_size_test on the Desktop, move every file larger than 100 KB into a subfolder named large inside it. Leave smaller files where they are."
    setup: |
      import shutil
      d = os.path.expanduser(r'~/Desktop/seguro_size_test')
      shutil.rmtree(d, ignore_errors=True); os.makedirs(d)
      for name, size in [('small_a.txt', 2000), ('small_b.log', 50000), ('big_a.bin', 300000), ('big_b.dat', 150000)]:
          open(os.path.join(d, name), 'wb').write(b'x' * size)
    check: |
      d = os.path.expanduser(r'~/Desktop/seguro_size_test')
      L = os.path.join(d, 'large')
      assert os.path.isdir(L), 'large/ missing'
      assert sorted(os.listdir(L)) == ['big_a.bin', 'big_b.dat'], os.listdir(L)
      assert os.path.exists(os.path.join(d, 'small_a.txt')) and os.path.exists(os.path.join(d, 'small_b.log')), os.listdir(d)
    cleanup: "import shutil; shutil.rmtree(os.path.expanduser(r'~/Desktop/seguro_size_test'), ignore_errors=True)"
    timeout_s: 120

